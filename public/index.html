<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>찌멍 · 찜멍</title>
<style>
  :root{--bg:#f6f0e4;--fg:#2b2620;--sub:#7a6e5e;--card:#fffaf0;--line:rgba(60,40,20,.12)}
  @media (prefers-color-scheme:dark){:root{--bg:#15191f;--fg:#f1ece2;--sub:#a59a8a;--card:#1f252d;--line:rgba(255,255,255,.1)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
  main{max-width:880px;margin:0 auto;padding:40px 16px 56px}
  h1{font-size:30px;margin:0 0 6px;letter-spacing:-.01em}
  p.lead{margin:0 0 28px;color:var(--sub)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .15s}
  a.card:hover{transform:translateY(-3px)}
  a.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#ccc}
  .body{padding:12px 14px 14px}
  .body b{font-size:17px}
  .body span{display:block;color:var(--sub);font-size:13.5px;margin-top:2px}
  footer{margin-top:28px;color:var(--sub);font-size:12.5px}
</style>
</head>
<body>
<main>
  <h1>🎣 찌멍 · ♨ 찜멍</h1>
  <p class="lead">말 걸지 않아도 되는, 그냥 멍하니 머물다 가는 3D 공간</p>
  <div class="grid">
    <a class="card" href="fishing/index.html?place=lake"><img src="fishing/screenshots/01-lake-overview.png" alt="새벽 저수지 낚시터"><div class="body"><b>찌멍 · 새벽 저수지</b><span>좌대에 앉아 찌를 바라봐요. 붕어 찌올림, 월척 기록 카드</span></div></a>
    <a class="card" href="fishing/index.html?place=ice"><img src="fishing/screenshots/04-ice-phone.png" alt="얼음 호수 빙어낚시"><div class="body"><b>찌멍 · 얼음 호수</b><span>얼음 구멍에 낚싯줄을 내리고 빙어를 낚아요</span></div></a>
    <a class="card" href="jjimjilbang/index.html"><img src="jjimjilbang/screenshots/01-overview.png" alt="동네 찜질방"><div class="body"><b>찜멍 · 동네 찜질방</b><span>불가마에서 땀 빼고, 계란은 이마로 깨고, 식혜 한 잔</span></div></a>
  </div>
  <footer>입질 타임: 한국 시간 새벽 5시 · 저녁 6시 (30분)</footer>
</main>
</body>
</html>
