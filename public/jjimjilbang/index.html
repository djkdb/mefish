<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>찜멍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --ui-bg: rgba(40, 22, 12, 0.55); --ui-fg: #fff3e2; --accent: #ff9a4a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f08; color: var(--ui-fg);
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #title { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 999px; background: var(--ui-bg); font-size: 14px; letter-spacing: 0.5px;
    white-space: nowrap; pointer-events: none; backdrop-filter: blur(4px); }
  #stats { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; padding: 6px 12px; border-radius: 999px;
    background: var(--ui-bg); font-size: 13px; pointer-events: none; white-space: nowrap; backdrop-filter: blur(4px); }
  #online { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 38px); left: 50%; transform: translateX(-50%);
    padding: 4px 12px; border-radius: 999px; background: var(--ui-bg); font-size: 12px; white-space: nowrap; pointer-events: none;
    display: none; backdrop-filter: blur(4px); }
  #online::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6fe08a; margin-right: 6px; vertical-align: 1px; }
  #online.off::before { background: #c9a27a; }
  #sound { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; border-radius: 50%;
    border: none; background: var(--ui-bg); color: var(--ui-fg); font-size: 18px; cursor: pointer; backdrop-filter: blur(4px); }
  #actions { position: fixed; right: 16px; bottom: max(28px, env(safe-area-inset-bottom)); display: flex; flex-direction: column;
    gap: 10px; align-items: flex-end; }
  #actions button { font-family: inherit; font-size: 17px; padding: 12px 22px; min-height: 50px; border-radius: 999px; border: 2px solid #fff3e2;
    background: linear-gradient(180deg, #ffad66, #f07a2c); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.35); cursor: pointer;
    animation: pop .25s ease-out; }
  #actions button.on { background: linear-gradient(180deg, #8fb7e8, #4f7fc0); }
  #actions button:disabled { opacity: .55; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #toast { position: fixed; left: 50%; top: 26%; transform: translate(-50%, 0); padding: 8px 18px; border-radius: 14px;
    background: rgba(40,22,12,.7); font-size: 18px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, -8px); }
  #hint { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 13px;
    padding: 6px 12px; border-radius: 999px; background: var(--ui-bg); pointer-events: none; transition: opacity 1s; white-space: nowrap; }
  #joy { position: fixed; left: 22px; bottom: max(24px, env(safe-area-inset-bottom)); width: 124px; height: 124px; border-radius: 50%;
    background: rgba(255, 240, 220, 0.16); border: 2px solid rgba(255, 240, 220, 0.4); display: none; touch-action: none; }
  #joy .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: rgba(255, 240, 220, 0.75); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  body.touch #joy { display: block; }
  body.touch #hint { bottom: 160px; }
  @media (max-width: 560px) {
    #stats { top: calc(max(10px, env(safe-area-inset-top)) + 38px); left: 50%; transform: translateX(-50%); font-size: 12px; }
    #title { font-size: 13px; }
    body.net #stats { top: calc(max(10px, env(safe-area-inset-top)) + 66px); }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>

<body>
<div id="title">♨ 찜멍 · 동네 찜질방</div>
<div id="online"></div>
<div id="stats">땀 0초 · 계란 0개 · 식혜 0잔</div>
<button id="sound" aria-label="소리 켜기/끄기">🔇</button>
<div id="actions"></div>
<div id="toast"></div>
<div id="hint">WASD·방향키로 이동 · 드래그로 시점 회전 · 클릭하면 소리가 나요</div>
<div id="joy"><div class="knob"></div></div>

<script type="module">
import * as THREE from 'three';

// ───────────────────────── 기본 설정 ─────────────────────────
const isTouch = ('ontouchstart' in window) || matchMedia('(pointer: coarse)').matches;
if (isTouch) {
  document.body.classList.add('touch');
  document.getElementById('hint').textContent = '왼쪽 아래 조이스틱으로 이동 · 터치하면 소리가 나요';
}

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0f08);
scene.fog = new THREE.Fog(0x2a1a10, 26, 46);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 80);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 공간 치수
const HALL = { x0: -18, x1: 18, z0: -14, z1: 16, h: 6 };
const KILN = { x: -11, z: -9.5, R: 4.5 };          // 황토 불가마 (돔, 문은 +z 방향)
const ICE  = { x0: 7, x1: 15, z0: -14, z1: -6.5, h: 3.2, doorX0: 10, doorX1: 12 }; // 얼음방
const SHOP = { x0: 15.0, x1: 18, z0: 0.5, z1: 6.5 }; // 매점 카운터 영역(막힘)

// ───────────────────────── 텍스처 헬퍼 ─────────────────────────
const FONT = "'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
const fontRedraws = [];
function canvasTex(w, h, draw, repeat, redrawOnFont) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  if (redrawOnFont) fontRedraws.push(() => { g.clearRect(0, 0, w, h); draw(g, w, h); t.needsUpdate = true; });
  return t;
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function speckle(g, w, h, n, colors, rmin, rmax) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = colors[(Math.random() * colors.length) | 0];
    g.globalAlpha = rnd(0.08, 0.3);
    g.beginPath(); g.arc(Math.random() * w, Math.random() * h, rnd(rmin, rmax), 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}
function textPlane(w, h, pw, ph, draw, opts = {}) {
  const tex = canvasTex(pw, ph, draw, null, true);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: !!opts.transparent, toneMapped: false, fog: false }));
  return m;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 장판(온돌 바닥)
const floorTex = canvasTex(512, 512, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, w, h); grd.addColorStop(0, '#d9a157'); grd.addColorStop(1, '#cf944a');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(140,80,30,0.18)'; g.lineWidth = 2;
  for (let y = 0; y < h; y += 6) { g.beginPath(); g.moveTo(0, y + Math.sin(y * 0.3) * 2);
    for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin((x + y) * 0.05) * 2); g.stroke(); }
  speckle(g, w, h, 300, ['#a86a2c', '#f0c27a'], 1, 3);
  g.strokeStyle = 'rgba(110,60,20,0.45)'; g.lineWidth = 3;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 256, 0); g.lineTo(i * 256, h); g.stroke();
    g.beginPath(); g.moveTo(0, i * 256); g.lineTo(w, i * 256); g.stroke(); }
}, [9, 7.5]);

// 벽: 위는 베이지 벽지, 아래는 나무 징두리
const wallTex = canvasTex(1024, 512, (g, w, h) => {
  g.fillStyle = '#e6d2ad'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(180,150,110,0.18)';
  for (let x = 0; x < w; x += 16) g.fillRect(x, 0, 3, h * 0.78);
  const wy = h * 0.78;
  g.fillStyle = '#7d4f2c'; g.fillRect(0, wy, w, h - wy);
  g.strokeStyle = 'rgba(40,20,8,0.5)'; g.lineWidth = 3;
  for (let x = 0; x < w; x += 64) { g.beginPath(); g.moveTo(x, wy); g.lineTo(x, h); g.stroke(); }
  g.fillStyle = '#5a3418'; g.fillRect(0, wy - 8, w, 10);
}, [4, 1]);

const ceilTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4f3420'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#3d2716'; for (let y = 0; y < h; y += 64) g.fillRect(0, y, w, 10);
  speckle(g, w, h, 80, ['#6b4a30'], 1, 4);
}, [8, 6]);

// 황토
function ochreDraw(dark) {
  return (g, w, h) => {
    g.fillStyle = dark ? '#a5582a' : '#c98a4b'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 500, dark ? ['#6a2c10', '#d9773a'] : ['#8f5a2a', '#e2b27a', '#a66b35'], 2, 9);
    g.strokeStyle = dark ? 'rgba(60,20,5,0.35)' : 'rgba(110,65,25,0.35)'; g.lineWidth = 3;
    for (let y = 0; y < h; y += 42) { g.beginPath(); g.moveTo(0, y + rnd(-4, 4)); g.lineTo(w, y + rnd(-4, 4)); g.stroke(); }
  };
}
const ochreTex = canvasTex(256, 256, ochreDraw(false), [6, 3]);
const ochreDarkTex = canvasTex(256, 256, ochreDraw(true), [6, 3]);

// 성에 낀 얼음 벽
const frostTex = canvasTex(256, 256, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, '#e9f7ff'); grd.addColorStop(1, '#a9d6f2');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 1.5;
  for (let i = 0; i < 26; i++) { // 성에 결정
    const x = Math.random() * w, y = Math.random() * h, r = rnd(6, 18);
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; g.beginPath(); g.moveTo(x, y);
      g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); g.stroke(); }
  }
  speckle(g, w, h, 400, ['#ffffff'], 0.5, 2.5);
  g.strokeStyle = 'rgba(120,170,210,0.4)'; g.lineWidth = 2;
  for (let x = 0; x <= w; x += 128) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
}, [3, 1]);

// 돗자리 매트
const matTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 6) { g.fillStyle = y % 12 ? '#e9e2d4' : '#d6ccb8'; g.fillRect(0, y, w, 4); }
  g.fillStyle = 'rgba(80,60,40,0.35)'; g.fillRect(0, 0, 8, h); g.fillRect(w - 8, 0, 8, h);
});

// 대나무 베개
const bambooTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#c9bf6a'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(120,110,40,0.35)'; for (let y = 0; y < h; y += 5) g.fillRect(0, y, w, 1);
  g.fillStyle = '#8f8434'; for (let x = 20; x < w; x += 72) g.fillRect(x, 0, 7, h);
});

// 멍석 (불가마 바닥)
const strawTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#b48a52'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(80,50,20,0.45)'; g.lineWidth = 2;
  for (let r = 8; r < 180; r += 9) { g.beginPath(); g.arc(w / 2, h / 2, r, 0, 7); g.stroke(); }
  speckle(g, w, h, 200, ['#e1bb7c', '#6e4a22'], 1, 3);
});

// 부드러운 원(김·입김·연기용)
const softTex = canvasTex(64, 64, (g, w, h) => {
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.5, 'rgba(255,255,255,0.45)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
});

// ───────────────────────── 조명 ─────────────────────────
scene.add(new THREE.HemisphereLight(0xffe0b8, 0x5a3a20, 1.25));
const dir = new THREE.DirectionalLight(0xffe6c4, 0.7); dir.position.set(4, 10, 6); scene.add(dir);
// 카메라 쪽에서 비추는 약한 보조광(얼굴이 너무 어둡지 않게)
const fill = new THREE.DirectionalLight(0xfff0e0, 0.55); scene.add(fill); scene.add(fill.target);
const tvLight = new THREE.PointLight(0x88aaff, 3, 14, 1.2); tvLight.position.set(-0.5, 3, -11.5); scene.add(tvLight);

// ───────────────────────── 홀(바닥·벽·천장) ─────────────────────────
const W = HALL.x1 - HALL.x0, D = HALL.z1 - HALL.z0, CX = (HALL.x0 + HALL.x1) / 2, CZ = (HALL.z0 + HALL.z1) / 2;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshLambertMaterial({ map: floorTex }));
floor.rotation.x = -Math.PI / 2; floor.position.set(CX, 0, CZ); scene.add(floor);

const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshLambertMaterial({ map: ceilTex }));
ceil.rotation.x = Math.PI / 2; ceil.position.set(CX, HALL.h, CZ); scene.add(ceil);

function wall(len, x, z, ry, rep) {
  const t = wallTex.clone(); t.needsUpdate = true; t.repeat.set(rep, 1);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len, HALL.h), new THREE.MeshLambertMaterial({ map: t }));
  m.position.set(x, HALL.h / 2, z); m.rotation.y = ry; scene.add(m); return m;
}
wall(W, CX, HALL.z0, 0, 6);
wall(W, CX, HALL.z1, Math.PI, 6);
wall(D, HALL.x0, CZ, Math.PI / 2, 5);
wall(D, HALL.x1, CZ, -Math.PI / 2, 5);

// 천장 형광등
{
  const geo = new THREE.BoxGeometry(2.6, 0.08, 0.45);
  const mat = new THREE.MeshBasicMaterial({ color: 0xfff0d2 });
  const inst = new THREE.InstancedMesh(geo, mat, 8);
  const m4 = new THREE.Matrix4(); let i = 0;
  for (const x of [-9, 0, 9]) for (const z of [-4, 6]) { m4.makeTranslation(x, HALL.h - 0.05, z); inst.setMatrixAt(i++, m4); }
  m4.makeTranslation(0, HALL.h - 0.05, 13); inst.setMatrixAt(i++, m4);
  m4.makeTranslation(-9, HALL.h - 0.05, 13); inst.setMatrixAt(i++, m4);
  scene.add(inst);
}

// ───────────────────────── 충돌체 ─────────────────────────
const boxes = []; // {x0,x1,z0,z1}
function addBox(x0, x1, z0, z1) { boxes.push({ x0, x1, z0, z1 }); }
const PLAYER_R = 0.35;

// ───────────────────────── 캐릭터(기본 도형) ─────────────────────────
const GEO = {
  torso: new THREE.CylinderGeometry(0.21, 0.25, 0.58, 14),
  hip: new THREE.CylinderGeometry(0.25, 0.25, 0.14, 14),
  shorts: new THREE.CylinderGeometry(0.12, 0.11, 0.3, 10),
  leg: new THREE.CylinderGeometry(0.075, 0.065, 0.32, 8),
  foot: new THREE.BoxGeometry(0.13, 0.07, 0.22),
  sleeve: new THREE.CylinderGeometry(0.095, 0.085, 0.22, 10),
  arm: new THREE.CylinderGeometry(0.06, 0.055, 0.3, 8),
  hand: new THREE.SphereGeometry(0.07, 10, 8),
  head: new THREE.SphereGeometry(0.28, 20, 16),
  eye: new THREE.SphereGeometry(0.032, 8, 6),
  cheek: new THREE.SphereGeometry(0.05, 10, 6),
  mouth: new THREE.TorusGeometry(0.04, 0.011, 4, 10, Math.PI),
  towelCap: new THREE.SphereGeometry(0.305, 20, 10, 0, Math.PI * 2, 0, Math.PI * 0.4),
  towelRoll: new THREE.CylinderGeometry(0.13, 0.13, 0.17, 16),
  towelSpiral: new THREE.TorusGeometry(0.07, 0.02, 6, 16),
  hairCap: new THREE.SphereGeometry(0.295, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.5),
  perm: new THREE.SphereGeometry(0.09, 8, 6),
  apron: new THREE.BoxGeometry(0.4, 0.5, 0.05),
  blob: new THREE.CircleGeometry(0.42, 20),
};
const matCache = new Map();
function lam(color) {
  if (!matCache.has(color)) matCache.set(color, new THREE.MeshLambertMaterial({ color }));
  return matCache.get(color);
}
const BLACK = new THREE.MeshBasicMaterial({ color: 0x2a1a12 });
const CHEEK = new THREE.MeshBasicMaterial({ color: 0xff8f8f, transparent: true, opacity: 0.75 });
const blobMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false });

function makeCharacter(o) {
  const skinMat = o.ownSkin ? new THREE.MeshLambertMaterial({ color: 0xf3cfa9 }) : lam(0xf3cfa9);
  const shirtMat = o.ownSkin ? new THREE.MeshLambertMaterial({ color: o.shirt }) : lam(o.shirt);
  const shortsMat = o.ownSkin ? new THREE.MeshLambertMaterial({ color: o.shorts }) : lam(o.shorts);
  const root = new THREE.Group(), lieG = new THREE.Group(), body = new THREE.Group();
  root.add(lieG); lieG.add(body);
  const add = (geo, mat, x, y, z, parent = body) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };

  add(GEO.torso, shirtMat, 0, 0.88, 0);
  add(GEO.hip, shortsMat, 0, 0.62, 0);
  const legs = [];
  for (const s of [1, -1]) {
    const p = new THREE.Group(); p.position.set(0.12 * s, 0.62, 0); body.add(p);
    add(GEO.shorts, shortsMat, 0, -0.15, 0, p);
    add(GEO.leg, skinMat, 0, -0.46, 0, p);
    add(GEO.foot, skinMat, 0, -0.585, 0.04, p);
    legs.push(p);
  }
  const arms = [];
  for (const s of [1, -1]) {
    const p = new THREE.Group(); p.position.set(0.29 * s, 1.12, 0); body.add(p);
    add(GEO.sleeve, shirtMat, 0, -0.09, 0, p);
    add(GEO.arm, skinMat, 0, -0.33, 0, p);
    const hand = add(GEO.hand, skinMat, 0, -0.5, 0, p);
    arms.push({ p, hand });
  }
  if (o.apron) add(GEO.apron, lam(o.apron), 0, 0.82, 0.24);
  const headG = new THREE.Group(); headG.position.y = 1.18; body.add(headG);
  add(GEO.head, skinMat, 0, 0.25, 0, headG);
  for (const s of [1, -1]) {
    add(GEO.eye, BLACK, 0.1 * s, 0.27, 0.255, headG);
    const c = add(GEO.cheek, CHEEK, 0.165 * s, 0.17, 0.21, headG); c.scale.set(1, 0.6, 0.4);
  }
  const mouth = add(GEO.mouth, BLACK, 0, 0.15, 0.265, headG); mouth.rotation.z = Math.PI;
  if (o.towel) { // 양머리 수건
    const tm = lam(o.towel), ts = lam(o.towelLine || 0xe0d2bf);
    add(GEO.towelCap, tm, 0, 0.27, -0.01, headG);
    for (const s of [1, -1]) {
      const r = add(GEO.towelRoll, tm, 0.25 * s, 0.38, -0.02, headG); r.rotation.z = Math.PI / 2;
      const sp = add(GEO.towelSpiral, ts, 0.336 * s, 0.38, -0.02, headG); sp.rotation.y = Math.PI / 2;
    }
  } else if (o.hair) {
    const hc = add(GEO.hairCap, lam(o.hair), 0, 0.27, -0.03, headG); hc.rotation.x = -0.25;
    if (o.perm) for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2, b = (i % 2) * 0.12;

function update(dt, t) {
  const p = player.root.position;
  state.modeT += dt;

  // 입력 → 이동 방향(카메라 기준)
  let ix = 0, iy = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iy += 1;

    if (state.mode === 'lie') { endLie(); player.root.position.x = state.lieAt.x + 0.85; }

    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
    const mx = fx * iy + rx * ix, mz = fz * iy + rz * ix;

function updateWorld(dt, t) {

/* ---------------- 함께 걷기 (실시간 서버) ----------------
   서버: Cloudflare Worker /ws (Durable Object 방 하나당 최대 30명)
   - file:// 로 열면 서버 없이 혼자 걷기만 해요.
   - 상태는 최대 1초에 10번, 바뀌었을 때만 보내요(가만히 있으면 0번).
   - 연결이 끊기면 몇 초 뒤 다시 연결하고, 그동안 혼자 걷기는 그대로.
   메시지
     보냄: {t:'hello',name,look,s} · {t:'s',s} · {t:'ev',e}
     받음: {t:'welcome',id,room,peers:[{id,name,look,s}],n} · {t:'join',id,name,look,s}
           {t:'s',id,s} · {t:'leave',id} · {t:'ev',id,e} · {t:'count',n}
*/
function createNet({ site, name, look, onWelcome, onJoin, onState, onLeave, onEvent, onCount, onStatus }) {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return null;
  const room = new URLSearchParams(location.search).get('room') || '';
  let ws = null, retry = 0, open = false, pingT = 0, lastSent = '', lastSentAt = 0, pending = null, lastState = null;
  function url() {
    return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?site=${site}${room ? `&room=${encodeURIComponent(room)}` : ''}`;
  }

    try { ws = new WebSocket(url()); } catch (e) { return later(); }

      ws.send(JSON.stringify({ t: 'hello', name, look, s: lastState }));
      clearInterval(pingT); pingT = setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 25000);
      onStatus && onStatus(true);
    };
    ws.onmessage = (e) => {
      if (e.data === 'pong') return;
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.t === 'welcome') onWelcome && onWelcome(m);
      else if (m.t === 'join') onJoin && onJoin(m);
      else if (m.t === 's') onState && onState(m.id, m.s);
      else if (m.t === 'leave') onLeave && onLeave(m.id);
      else if (m.t === 'ev') onEvent && onEvent(m.id, m.e);
      else if (m.t === 'count') onCount && onCount(m.n);
    };
    ws.onclose = () => { const was = open; open = false; clearInterval(pingT); if (was || retry === 0) onStatus && onStatus(false); later(); };
    ws.onerror = () => { try { ws.close(); } catch (_) { } };
  }
  function later() { const d = Math.min(10000, 1500 * 2 ** retry++) + Math.random() * 600; setTimeout(connect, d); }
  function flush() {
    if (!pending || !open) return;
    const j = JSON.stringify(pending); pending = null;
    if (j === lastSent) return;
    lastSent = j; lastSentAt = performance.now();
    ws.send(`{"t":"s","s":${j}}`);
  }
  connect();
  return {
    // 매 프레임 불러도 돼요: 100ms 간격 + 바뀐 경우에만 실제로 전송
    state(s) {
      lastState = s; pending = s;
      if (performance.now() - lastSentAt >= 100) flush();
    },
    event(e) { if (open) ws.send(JSON.stringify({ t: 'ev', e })); },
    get connected() { return open; },
  };
}

const onlineEl = document.getElementById('online');
let wasOnline = false;
function showOnline(n) { onlineEl.style.display = 'block'; onlineEl.classList.remove('off'); onlineEl.textContent = `지금 ${n}명 함께 있어요`; }
const net = createNet({
  site: 'jjim', name: me.name, look: me.look,
  onWelcome(m) {
    clearRemotes();
    for (const p of m.peers || []) addRemote(p);
    showOnline(m.n || remotes.size + 1);
    if (!wasOnline) toast(`${me.name} 님, 어서 오세요 ♨`, 2.4);
    wasOnline = true;
  },
  onJoin(p) { if (addRemote(p)) toast(`${String(p.name || '손님').slice(0, 16)} 님이 들어왔어요`, 1.8); },
  onState(id, s) { const r = remotes.get(id); if (r) applyRemoteState(r, s, false); },
  onLeave(id) { removeRemote(id); },
  onEvent(id, e) { const r = remotes.get(id); if (r && e && (e.k === 'egg' || e.k === 'drink') && !r.shot) r.shot = { k: e.k, T: 0 }; },
  onCount(n) { showOnline(n); },
  onStatus(ok) {
    if (ok) return;
    clearRemotes();
    onlineEl.style.display = 'block'; onlineEl.classList.add('off'); onlineEl.textContent = '혼자 걷는 중 · 다시 연결 중…';
  },
});
if (net) document.body.classList.add('net');

// 테스트·디버그용 훅
window.__jjim = { player, state, stats, setMode, doSweat, doLie, doCool, doEgg, doDrink, mats, KILN, ICE, me, remotes, net,
  get camYaw() { return camYaw; }, set camYaw(v) { camYaw = v; } };
</script>
