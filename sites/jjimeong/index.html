<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16202c">
<title>찌멍</title>
<style>
  :root{--ui:rgba(18,26,36,.55);--fg:#f6f1e7;--accent:#ffb347;--hot:#ff6b3d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#101820;color:var(--fg);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #c{display:block;position:fixed;inset:0;width:100%;height:100%}
  .glass{background:var(--ui);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)}
  #top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5;max-width:calc(100% - 130px)}
  #place{font-size:14px;font-weight:800;letter-spacing:.03em;padding:6px 14px;border-radius:999px;white-space:nowrap}
  #clock{font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
  #online{font-size:12px;padding:4px 10px;border-radius:999px;display:none;white-space:nowrap}
  #online.off{opacity:.75}
  #clock.rush{background:rgba(255,170,70,.92);color:#2a1806;font-weight:800;border-color:transparent}
  .round{position:fixed;width:44px;height:44px;border-radius:50%;color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer;z-index:6;padding:0}
  #soundBtn{top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
  #dexBtn{top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left))}
  #side{position:fixed;top:calc(62px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:5}
  #counter{font-size:12px;padding:4px 10px;border-radius:999px}
  #placeBtn{font:inherit;font-size:12px;font-weight:700;color:#fff;padding:6px 11px;border-radius:999px;cursor:pointer}
  #joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;z-index:6;display:none;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #actWrap{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:6}
  #status{font-size:13px;padding:6px 12px;border-radius:999px;display:none;max-width:60vw;text-align:right}
  #standBtn{font:inherit;font-size:13px;color:#fff;padding:7px 14px;border-radius:999px;display:none;cursor:pointer}
  #act{font:inherit;font-size:18px;font-weight:800;min-width:132px;height:62px;padding:0 22px;border-radius:999px;border:0;
    background:var(--accent);color:#2b1a05;box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;cursor:pointer;transition:transform .12s,background .2s,opacity .2s}
  #act:active{transform:scale(.95)}
  #act.calm{background:rgba(255,255,255,.85);color:#203040}
  #act.hot{background:var(--hot);color:#fff;animation:pulse .32s infinite alternate}
  #act.off{opacity:.45;pointer-events:none}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
  #toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;text-shadow:0 3px 14px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .3s;z-index:7;text-align:center;white-space:nowrap}
  #toast small{display:block;font-size:15px;font-weight:600;margin-top:4px}
  #hint{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12.5px;padding:7px 14px;border-radius:999px;z-index:5;transition:opacity .6s;pointer-events:none;white-space:nowrap}
  .modal{position:fixed;inset:0;background:rgba(5,10,16,.55);display:grid;place-items:center;z-index:20;padding:16px}
  .modal.hidden{display:none}
  .card{background:#fbf6ea;color:#2b2620;border-radius:18px;padding:14px;width:min(92vw,420px);max-height:92vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .card h3{margin:4px 4px 10px;font-size:18px}
  #cardImg{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:10px;background:#eee4cf;-webkit-touch-callout:default;user-select:auto}
  .row{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;height:46px;border-radius:12px;border:0;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .btn.main{background:#2b6cb0;color:#fff}.btn.sub{background:#e6dcc6;color:#3a3026}
  .small{font-size:12px;color:#7a6e5e;margin:8px 2px 0;text-align:center}
  #dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
  .cell{background:#fff;border-radius:12px;padding:8px;text-align:center;font-size:12px;color:#5a5044}
  .cell canvas{width:100%;height:auto;display:block}
  .cell b{display:block;font-size:14px;color:#2b2620;margin:2px 0}
  #dexTotal{margin:10px 2px 0;font-size:13px;color:#5a5044;text-align:center}
  @media (max-width:560px){#side{top:calc(132px + env(safe-area-inset-top))}#hint{bottom:calc(166px + env(safe-area-inset-bottom));white-space:normal;width:86vw;text-align:center;border-radius:14px}}
</style>

<body>
<canvas id="c"></canvas>
<div id="top"><div id="place" class="glass">찌멍</div><div id="clock" class="glass"></div><div id="online" class="glass"></div></div>
<button id="soundBtn" class="round glass" aria-label="소리 켜기/끄기">🔇</button>
<button id="dexBtn" class="round glass" aria-label="물고기 도감">📖</button>
<div id="side"><div id="counter" class="glass">오늘 0마리</div><button id="placeBtn" class="glass"></button></div>
<div id="joy" class="glass"><div id="knob"></div></div>
<div id="actWrap"><div id="status" class="glass"></div><button id="standBtn" class="glass">일어나기</button><button id="act"></button></div>
<div id="toast"></div>
<div id="hint" class="glass"></div>

<div id="catchModal" class="modal hidden">
  <div class="card">
    <img id="cardImg" alt="기록 카드">
    <div class="row"><button id="saveCard" class="btn main">기록 카드 저장</button><button id="release" class="btn sub">놓아주기</button></div>
    <div class="small">휴대폰에서는 카드를 길게 눌러 저장할 수도 있어요</div>
  </div>
</div>
<div id="dexModal" class="modal hidden">
  <div class="card"><h3 id="dexTitle">물고기 도감</h3><div id="dexGrid"></div><div id="dexTotal"></div>
    <div class="row"><button id="dexClose" class="btn sub">닫기</button></div></div>
</div>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   찌멍 — 걸어 다니며 찌를 멍하니 바라보는 3D 낚시터
   장소: 새벽 저수지(?place=lake) / 얼음 호수(?place=ice)
   디버그: ?t=18.2 (한국 시간 고정), ?fast (입질 빠르게)
   ========================================================= */

const params = new URLSearchParams(location.search);
const PLACE_ID = params.get('place') === 'ice' ? 'ice' : 'lake';
const FAST = params.has('fast');
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
const LOW = IS_TOUCH || Math.min(innerWidth, innerHeight) < 600;
const FONT = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = t => t * t * (3 - 2 * t);
const pad = n => String(n).padStart(2, '0');
const lam = (color, o = {}) => new THREE.MeshLambertMaterial({ color, ...o });
const shade = (hex, f) => new THREE.Color(hex).multiplyScalar(f);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------------- 장소 설정 ---------------- */
const SPECIES = {
  lake: [
    { id: 'crucian', name: '붕어', min: 12, max: 38, w: 60, color: 0x8f8444, belly: 0xd8c88a, shape: 'crucian', bite: 'rise' },
    { id: 'carp', name: '잉어', min: 30, max: 78, w: 22, color: 0x7d6a4c, belly: 0xcdb586, shape: 'carp', bite: 'sink' },
    { id: 'catfish', name: '메기', min: 30, max: 72, w: 12, color: 0x4b4a42, belly: 0xbab2a0, shape: 'catfish', bite: 'sink' },
    { id: 'golden', name: '황금 잉어', min: 40, max: 85, w: 1.2, color: 0xf2b630, belly: 0xffe08a, shape: 'carp', bite: 'rise', glow: 0x664000 },
    { id: 'boot', name: '낡은 장화', min: 26, max: 30, w: 3, color: 0x3b4b2f, shape: 'boot', bite: 'sink', junk: true },
  ],
  ice: [
    { id: 'smelt', name: '빙어', min: 6, max: 15, w: 70, color: 0xbfd2dc, belly: 0xf2f7fa, shape: 'slim', bite: 'dip' },
    { id: 'masu', name: '산천어', min: 18, max: 45, w: 16, color: 0x667766, belly: 0xeadccc, shape: 'trout', bite: 'sink', spots: true },
    { id: 'rainbow', name: '무지개송어', min: 25, max: 58, w: 9, color: 0x7b8a78, belly: 0xf2d6d2, shape: 'trout', bite: 'sink', stripe: 0xe0788a },
    { id: 'goldtrout', name: '황금 송어', min: 35, max: 60, w: 1.2, color: 0xf0b838, belly: 0xffe6a0, shape: 'trout', bite: 'sink', glow: 0x553300 },
    { id: 'glove', name: '잃어버린 장갑', min: 22, max: 25, w: 3, color: 0xc0393b, shape: 'glove', bite: 'dip', junk: true },
  ],
};
const PLACES = {
  lake: { title: '새벽 저수지', spotWord: '좌대', ice: false, wait: [14, 55], rushWait: [6, 20],
          rodLen: 2.8, rodPitch: 1.0, bobScale: 1.7, castArc: 3.2,
          camFish: { back: 2.7, up: 1.65, side: 0.85, look: 0.85 },
          other: { id: 'ice', label: '❄️ 얼음낚시 가기' },
          greet: ['안녕하세요~', '쉿… 입질 와요', '오늘 물 좋네요', '찌 보다 보면 시간 금방 가요'],
          npcTalk: ['붕어 한 마리~', '오늘 손맛 좋네', '아… 놓쳤다', '찌올림 봤어요?'] },
  ice:  { title: '얼음 호수', spotWord: '구멍', ice: true, wait: [5, 20], rushWait: [3, 9],
          rodLen: 1.0, rodPitch: 1.15, bobScale: 0.95, castArc: 0.25,
          camFish: { back: 2.5, up: 2.4, side: 1.7, look: 0.95 },
          other: { id: 'lake', label: '🌅 저수지 가기' },
          greet: ['어서 와요~', '손 시리죠?', '여기 빙어 잘 나와요', '호떡 먹고 왔어요'],
          npcTalk: ['빙어 또 잡았다!', '손 시려…', '오늘 입질 좋네', '아… 놓쳤다'] },
};
const PL = PLACES[PLACE_ID];
const SP = SPECIES[PLACE_ID];
const LAKE = PL.ice ? { rx: 26, rz: 20 } : { rx: 22, rz: 16 };
const OUTER = { cx: 0, cz: 4, r: PL.ice ? 40 : 38 };
const GROUND_Y = PL.ice ? 0.1 : 0.15;
const DOCK_Y = 0.45;
const inLake = (x, z, m = 0) => (x * x) / ((LAKE.rx + m) ** 2) + (z * z) / ((LAKE.rz + m) ** 2) < 1;

/* ---------------- 렌더러 / 장면 ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8899aa, 50, 230);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 700);
const photoCam = new THREE.PerspectiveCamera(40, 1, 0.1, 700);

const hemi = new THREE.HemisphereLight(0xffffff, 0x4a5a3a, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 140 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

/* ---------------- 하늘 ---------------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTop: { value: new THREE.Color() }, uBot: { value: new THREE.Color() },
              uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color() },
              uGlow: { value: 1 }, uDisc: { value: 1 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uTop,uBot,uSunCol,uSunDir; uniform float uGlow,uDisc; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y*1.5+0.04,0.0,1.0);
      vec3 c = mix(uBot,uTop,pow(h,0.65));
      float s = max(dot(d,normalize(uSunDir)),0.0);
      c += uSunCol*(pow(s,6.0)*0.32*uGlow + smoothstep(0.9986,0.9993,s)*1.6*uDisc);
      gl_FragColor = vec4(c,1.0);
      #include <colorspace_fragment>
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(420, 32, 16), skyMat));

// 별
const starGeo = new THREE.BufferGeometry();
{ const a = []; for (let i = 0; i < 900; i++) { const th = Math.random() * Math.PI * 2, y = rand(0.08, 1); const r = Math.sqrt(1 - y * y);
    a.push(Math.cos(th) * r * 380, y * 380, Math.sin(th) * r * 380); }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(a, 3)); }
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
scene.add(new THREE.Points(starGeo, starMat));

// 뭉게구름
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, fog: false, depthWrite: false });
const clouds = new THREE.Group(); scene.add(clouds);
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group(); const a = rand(0, Math.PI * 2), r = rand(170, 230);
  g.position.set(Math.cos(a) * r, rand(55, 85), Math.sin(a) * r);
  for (let k = 0; k < 5; k++) { const m = new THREE.Mesh(new THREE.SphereGeometry(rand(7, 12), 10, 8), cloudMat);
    m.position.set(k * 9 - 18 + rand(-2, 2), rand(-2, 3), rand(-4, 4)); m.scale.y = 0.55; g.add(m); }
  g.lookAt(0, g.position.y, 0); clouds.add(g);
}

/* ---------------- 텍스처 도우미 ---------------- */
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  t.anisotropy = 4; return t;
}
function noiseTex(colors, repeat, dots = 2600) {
  return canvasTex(256, 256, (c, w, h) => { c.fillStyle = colors[0]; c.fillRect(0, 0, w, h);
    for (let i = 0; i < dots; i++) { c.fillStyle = pick(colors); const s = rand(1, 4); c.fillRect(rand(0, w), rand(0, h), s, s); } }, repeat);
}
const woodTex = canvasTex(256, 256, (c, w, h) => {
  c.fillStyle = '#8a6440'; c.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) { c.fillStyle = `hsl(28,${rand(30, 42)}%,${rand(30, 40)}%)`; c.fillRect(0, y + 2, w, 28);
    c.strokeStyle = 'rgba(40,24,10,.35)'; for (let k = 0; k < 4; k++) { c.beginPath(); const yy = y + rand(5, 27); c.moveTo(0, yy); c.bezierCurveTo(80, yy + rand(-3, 3), 170, yy + rand(-3, 3), w, yy); c.stroke(); } }
});
const glowTex = canvasTex(64, 64, (c, w) => { const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, w, w); });
function glow(color, size) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
  s.scale.setScalar(size); nightGlows.push(s); return s;
}
function signTex(lines, bg = '#f3ead2', fg = '#3a2a18', w = 512, h = 256) {
  return canvasTex(w, h, (c) => {
    c.fillStyle = bg; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(60,40,20,.5)'; c.lineWidth = 10; c.strokeRect(5, 5, w - 10, h - 10);
    c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
    lines.forEach((l, i) => { c.font = `${l.weight || 800} ${l.size}px ${FONT}`; c.fillStyle = l.color || fg; c.fillText(l.text, w / 2, l.y); });
  });
}

/* ---------------- 공용 월드 데이터 ---------------- */
const obstacles = [];     // {x,z,r} 또는 {x0,x1,z0,z1}
const dockRects = [];     // 좌대·잔교 (회전된 사각형)
const spots = [];         // 낚시 자리
const nightGlows = [];    // 밤에 켜지는 빛 스프라이트
const nightMats = [];     // 밤에 밝아지는 창문 등
const swayU = { value: 0 };
let waterMesh = null, waterBase = null, waterMat = null, fireflies = null, mists = [], snow = null, steams = [];

const makeRect = (cx, cz, dx, dz, hl, hw) => ({ cx, cz, dx, dz, hl, hw });
function inRect(r, x, z, m = 0) { const qx = x - r.cx, qz = z - r.cz; const a = qx * r.dx + qz * r.dz, s = -qx * r.dz + qz * r.dx; return Math.abs(a) <= r.hl + m && Math.abs(s) <= r.hw + m; }

function swayMaterial(color) {
  const m = lam(color);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = swayU;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        float ph = instanceMatrix[3].x*0.7 + instanceMatrix[3].z*0.45;
      #else
        float ph = 0.0;
      #endif
      float k = max(position.y,0.0);
      transformed.x += sin(uTime*1.3+ph)*0.05*k*k;
      transformed.z += cos(uTime*1.05+ph)*0.035*k*k;`);
  };
  return m;
}
function instanced(geo, mat, list, shadow = false) {
  const im = new THREE.InstancedMesh(geo, mat, list.length); const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  list.forEach((t, i) => { e.set(t.rx || 0, t.ry || 0, t.rz || 0); q.setFromEuler(e);
    m4.compose(new THREE.Vector3(t.x, t.y, t.z), q, new THREE.Vector3(t.sx ?? t.s ?? 1, t.sy ?? t.s ?? 1, t.sz ?? t.s ?? 1)); im.setMatrixAt(i, m4);
    if (t.c !== undefined) im.setColorAt(i, new THREE.Color(t.c)); });
  im.castShadow = shadow; im.receiveShadow = true; scene.add(im); return im;
}
function ellipseRing(ax, az, y0, bx, bz, y1, mat, seg = 120) {
  const pos = [], idx = [];
  for (let i = 0; i <= seg; i++) { const a = i / seg * Math.PI * 2, c = Math.cos(a), s = Math.sin(a); pos.push(ax * c, y0, az * s, bx * c, y1, bz * s); }
  for (let i = 0; i < seg; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.receiveShadow = true; scene.add(m); return m;
}
function groundWithHole(mat, y) {

const onlineEl = document.getElementById('online');

function updateRemotes(dt) {

    const ox = r.pos.x, oz = r.pos.z;

      else if (s.f === 4) { tg.rod = 0.45 + 0.08 * Math.sin(T * 24); tg.armRx = -1.5; tg.armLx = -1.3; tg.rodK = 8; }

      r.dy = damp(r.dy, want, s.f === 3 ? 6 : 12, dt);
      r.bobber.position.set(spot.bob.x, spot.waterY + waveH(spot.bob.x, spot.bob.z, T) - WATERLINE * PL.bobScale + r.dy * PL.bobScale, spot.bob.z);
    } else r.dy = 0;
