<style>
  :root{--bg:#121417;--bg2:#1b1f24;--bg3:#272c33;--line:rgba(255,255,255,.12);--fg:#fff;--mut:#9aa1ab;--acc:#FF4A1C;--bite:#9BFF4A;
    --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{height:100dvh}
  .num{font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;touch-action:manipulation}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* 상단 바 */
  #bar{position:fixed;z-index:5;top:calc(8px + var(--st));left:calc(8px + var(--sl));right:calc(8px + var(--sr));max-width:720px;margin:0 auto;
    display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 5px 5px 12px;min-height:56px}
  #titleBox{flex:1;min-width:0}
  #place{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #clock{font-size:13px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #clock.rush{color:var(--acc);font-weight:700}
  #online{font-size:13px;height:44px;padding:0 10px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}
  #online::before{content:"";width:7px;height:7px;border-radius:50%;background:#3ddc84}
  #online.off::before{background:#6b7280}
  #online[hidden]{display:none}
  .ib{width:44px;height:44px;flex:none;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:0}
  .ib svg,.row-btn svg,.btn svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ib svg{width:22px;height:22px}
  .ib:active,.btn.ghost:active,.row-btn:active{background:var(--bg3)}
  .btn.primary:active{filter:brightness(.88)}
  /* 조이스틱 · 버튼 */
  #joy{position:fixed;z-index:4;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(18,20,23,.35);pointer-events:none;display:none}
  #joy.ghost{opacity:.4}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff}
  #actWrap{position:fixed;z-index:6;right:calc(16px + var(--sr));bottom:calc(20px + var(--sb));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #status{font-size:14px;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;display:none;max-width:62vw;text-align:right}
  #act{display:none;min-width:156px;height:68px;padding:0 24px;border-radius:8px;border:0;background:var(--acc);color:#fff;font-size:19px;font-weight:800;cursor:pointer;transition:transform .08s}
  #act:active{transform:scale(.96)}
  #act.calm{background:var(--bg);border:1px solid rgba(255,255,255,.4)}
  #act.hot{background:var(--bite);color:#0d0f12;min-width:184px;height:116px;font-size:32px;animation:pulse .3s infinite alternate}
  #act.off{opacity:.5;pointer-events:none}
  @keyframes pulse{to{transform:scale(1.06)}}
  #toast{position:fixed;z-index:40;left:50%;top:calc(76px + var(--st));transform:translateX(-50%);background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:6px;padding:10px 14px;font-size:16px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
  #toast small{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-top:2px}
  .btn{height:50px;padding:0 16px;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
  .btn.primary{background:var(--acc);color:#fff}
  .btn.ghost{background:transparent;border-color:rgba(255,255,255,.32)}
  .btn.sm{height:44px;font-size:14px;padding:0 14px}
  .btn svg{width:18px;height:18px}
  /* 시트 · 모달 */
  .layer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
  .layer.center{align-items:center}
  #storyView{background:var(--bg);z-index:25}
  .hidden{display:none !important}
  .panel{width:100%;max-width:520px;max-height:min(86dvh,760px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;
    padding:4px 16px calc(16px + var(--sb));touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;position:sticky;top:-4px;background:var(--bg);z-index:1}
  .panel-h h2{font-size:18px;margin:0}
  .row-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 2px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;font-size:16px;cursor:pointer}
  .row-btn small{margin-left:auto;color:var(--mut);font-size:14px}
  .row-btn svg{width:22px;height:22px;flex:none}
  .sec{border-top:1px solid var(--line);padding:14px 0}
  .sec h3{font-size:15px;margin:0 0 6px}
  .sec p,.inst p{font-size:14px;color:#c9ced6;margin:4px 0;line-height:1.55}
  .key{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:13px;line-height:20px}
  .dex-row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .dex-row canvas{width:96px;height:48px;background:var(--bg2);border-radius:4px}
  .dex-row b{font-size:16px;display:block}
  .dex-row span{font-size:13px;color:var(--mut)}
  .wrap{width:100%;max-width:440px;max-height:100%;display:flex;flex-direction:column;gap:8px;padding:calc(10px + var(--st)) 12px calc(12px + var(--sb))}
  #cardImg,#storyImg{display:block;width:100%;min-height:0;flex:1 1 auto;max-height:calc(100dvh - 200px);object-fit:contain;border-radius:6px;background:#000;
    -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:auto}
  .btnrow{display:flex;gap:8px}.btnrow .btn{flex:1;min-width:0}
  .note{font-size:13px;color:var(--mut);text-align:center;margin:0;line-height:1.5;min-height:18px}
  .note b{color:#fff}
  /* 튜토리얼 */
  #tut .panel{border-radius:8px;border-bottom:1px solid var(--line);max-width:460px;margin:12px;padding:4px 16px 16px;max-height:calc(100dvh - 24px)}
  .tut-art{height:150px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:4px}
  .tut-art svg{width:100%;height:100%;display:block}
  .tut-step h2{font-size:24px;margin:14px 0 6px;letter-spacing:-.02em}
  .tut-step p{font-size:16px;line-height:1.55;color:#d7dbe1;margin:6px 0}
  .dots{display:flex;gap:6px;justify-content:center;margin:14px 0 10px}
  .dots i{width:22px;height:4px;border-radius:2px;background:var(--bg3)}.dots i.on{background:var(--acc)}
  .tut-skip{display:block;margin:6px auto 0;background:none;border:0;color:var(--mut);font-size:14px;min-height:44px;padding:0 12px;cursor:pointer;text-decoration:underline}
  .inst{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:8px}
  .inst .btnrow{margin-top:10px}
  .inst svg.share{width:18px;height:18px;vertical-align:-3px;stroke:#4da3ff;fill:none;stroke-width:2}
  /* 로딩 · 디버그 */
  #loading{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  .ld-mark{font-size:34px;font-weight:800;letter-spacing:-.03em}
  .ld-bar{width:160px;height:3px;background:var(--bg3);overflow:hidden;border-radius:2px}
  .ld-bar i{display:block;width:40%;height:100%;background:var(--acc);animation:ld 1s infinite ease-in-out}
  @keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .ld-msg{font-size:14px;color:var(--mut);max-width:280px;line-height:1.5}
  #dbg{position:fixed;z-index:30;left:calc(8px + var(--sl));top:calc(72px + var(--st));background:rgba(0,0,0,.8);color:var(--bite);font:12px/1.45 ui-monospace,Menlo,monospace;
    padding:6px 8px;border-radius:4px;pointer-events:none;white-space:pre-wrap;max-width:min(92vw,420px)}
  @media (orientation:landscape) and (max-height:500px){
    #bar{min-height:48px;padding:2px 4px 2px 10px;max-width:560px;left:calc(8px + var(--sl));right:auto;width:min(560px,calc(100vw - 16px))}
    #toast{top:calc(64px + var(--st))}
    #act.hot{height:96px}
    #cardImg,#storyImg{max-height:calc(100dvh - 140px)}
  }
</style>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   찌멍 — 걸어 다니며 찌를 멍하니 바라보는 3D 낚시터
   장소: 새벽 저수지(?place=lake) / 얼음 호수(?place=ice)
   디버그: ?t=18.2 (한국 시간 고정), ?fast (입질 빠르게)
   ========================================================= */

const params = new URLSearchParams(location.search);
const PLACE_ID = params.get('place') === 'ice' ? 'ice' : 'lake';
const FAST = params.has('fast');
const Q_FIXED = params.get('q'); // high | low (테스트·디버그용 화질 고정)
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
const LOW = IS_TOUCH || Math.min(innerWidth, innerHeight) < 600;
const FONT = '"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = t => t * t * (3 - 2 * t);
const pad = n => String(n).padStart(2, '0');
const lam = (color, o = {}) => new THREE.MeshLambertMaterial({ color, ...o });
const shade = (hex, f) => new THREE.Color(hex).multiplyScalar(f);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------------- 장소 설정 ---------------- */
const SPECIES = {
  lake: [
    { id: 'crucian', name: '붕어', min: 12, max: 38, w: 60, color: 0x8f8444, belly: 0xd8c88a, shape: 'crucian', bite: 'rise' },
    { id: 'carp', name: '잉어', min: 30, max: 78, w: 22, color: 0x7d6a4c, belly: 0xcdb586, shape: 'carp', bite: 'sink' },
    { id: 'catfish', name: '메기', min: 30, max: 72, w: 12, color: 0x4b4a42, belly: 0xbab2a0, shape: 'catfish', bite: 'sink' },
    { id: 'golden', name: '황금 잉어', min: 40, max: 85, w: 1.2, color: 0xf2b630, belly: 0xffe08a, shape: 'carp', bite: 'rise', glow: 0x664000 },
    { id: 'boot', name: '낡은 장화', min: 26, max: 30, w: 3, color: 0x3b4b2f, shape: 'boot', bite: 'sink', junk: true },
  ],
  ice: [
    { id: 'smelt', name: '빙어', min: 6, max: 15, w: 70, color: 0xbfd2dc, belly: 0xf2f7fa, shape: 'slim', bite: 'dip' },
    { id: 'masu', name: '산천어', min: 18, max: 45, w: 16, color: 0x667766, belly: 0xeadccc, shape: 'trout', bite: 'sink', spots: true },
    { id: 'rainbow', name: '무지개송어', min: 25, max: 58, w: 9, color: 0x7b8a78, belly: 0xf2d6d2, shape: 'trout', bite: 'sink', stripe: 0xe0788a },
    { id: 'goldtrout', name: '황금 송어', min: 35, max: 60, w: 1.2, color: 0xf0b838, belly: 0xffe6a0, shape: 'trout', bite: 'sink', glow: 0x553300 },
    { id: 'glove', name: '잃어버린 장갑', min: 22, max: 25, w: 3, color: 0xc0393b, shape: 'glove', bite: 'dip', junk: true },
  ],
};
const PLACES = {
  lake: { title: '새벽 저수지', spotWord: '좌대', ice: false, wait: [14, 55], rushWait: [6, 20],
          rodLen: 2.8, rodPitch: 1.0, bobScale: 1.7, castArc: 3.2,
          camFish: { back: 2.7, up: 1.65, side: 0.85, look: 0.85 },
          other: { id: 'ice', label: '❄️ 얼음낚시 가기' },
          greet: ['안녕하세요~', '쉿… 입질 와요', '오늘 물 좋네요', '찌 보다 보면 시간 금방 가요'],
          npcTalk: ['붕어 한 마리~', '오늘 손맛 좋네', '아… 놓쳤다', '찌올림 봤어요?'] },
  ice:  { title: '얼음 호수', spotWord: '구멍', ice: true, wait: [5, 20], rushWait: [3, 9],
          rodLen: 1.0, rodPitch: 1.15, bobScale: 0.95, castArc: 0.25,
          camFish: { back: 2.5, up: 2.4, side: 1.7, look: 0.95 },
          other: { id: 'lake', label: '🌅 저수지 가기' },
          greet: ['어서 와요~', '손 시리죠?', '여기 빙어 잘 나와요', '호떡 먹고 왔어요'],
          npcTalk: ['빙어 또 잡았다!', '손 시려…', '오늘 입질 좋네', '아… 놓쳤다'] },
};
const PL = PLACES[PLACE_ID];
const SP = SPECIES[PLACE_ID];
const LAKE = PL.ice ? { rx: 36, rz: 27 } : { rx: 34, rz: 24 };
const OUTER = { cx: 0, cz: 6, r: PL.ice ? 56 : 54 };
const ISLAND = PL.ice ? null : { x: 11, z: -11, r: 4.6 };      // 저수지 섬 (정자)
const SLED = { x: 24.5, z0: -10, z1: 12, hw: 2 };              // 얼음 호수 썰매장
const SPAWN = { x: 0, z: LAKE.rz + (PL.ice ? 11 : 8) };
const GROUND_Y = PL.ice ? 0.1 : 0.15;
const DOCK_Y = 0.45;
const inLake = (x, z, m = 0) => (x * x) / ((LAKE.rx + m) ** 2) + (z * z) / ((LAKE.rz + m) ** 2) < 1;
const inIsland = (x, z, m = 0) => !!ISLAND && Math.hypot(x - ISLAND.x, z - ISLAND.z) < ISLAND.r + m;
const inSledLane = (x, z, m = 0) => PL.ice && Math.abs(x - SLED.x) < SLED.hw + m && z > SLED.z0 - m && z < SLED.z1 + m;

/* ---------------- 렌더러 / 장면 ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8899aa, 60, 300);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 700);
const photoCam = new THREE.PerspectiveCamera(40, 1, 0.1, 700);

}

}

function swayMaterial(color) {
  const m = lam(color);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = swayU;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        float ph = instanceMatrix[3].x*0.7 + instanceMatrix[3].z*0.45;
      #else
        float ph = 0.0;
      #endif
      float k = max(position.y,0.0);
      transformed.x += sin(uTime*1.3+ph)*0.05*k*k;
      transformed.z += cos(uTime*1.05+ph)*0.035*k*k;`);
  };
  return m;
}

  const im = new THREE.InstancedMesh(geo, mat, list.length); const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  list.forEach((t, i) => { e.set(t.rx || 0, t.ry || 0, t.rz || 0); q.setFromEuler(e);
    m4.compose(new THREE.Vector3(t.x, t.y, t.z), q, new THREE.Vector3(t.sx ?? t.s ?? 1, t.sy ?? t.s ?? 1, t.sz ?? t.s ?? 1)); im.setMatrixAt(i, m4);
    if (t.c !== undefined) im.setColorAt(i, new THREE.Color(t.c)); });

}

  for (let i = 0; i < seg; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();

}

function scatterPines(snowy, avoid = []) {
  const outside = [], inside = [];

  for (let i = 0; i < nOut; i++) { const a = rand(0, Math.PI * 2), r = rand(OUTER.r + 3, OUTER.r + 50); const x = Math.cos(a) * r, z = Math.sin(a) * r + OUTER.cz;
    outside.push({ x, y: 0, z, s: rand(0.9, 1.7), ry: rand(0, 6) }); }
  let tries = 0;
  while (inside.length < 30 && tries++ < 2000) {
    const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random()) * (OUTER.r - 2.5); const x = Math.cos(a) * r, z = Math.sin(a) * r + OUTER.cz;

    if (inside.some(t => Math.hypot(t.x - x, t.z - z) < 4.5)) continue;

function mergeGeos(list) {
  const pos = [], nor = [], m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1);
  for (const it of list) {
    const g = it.g.clone(); e.set(...(it.r || [0, 0, 0])); q.setFromEuler(e);
    m.compose(new THREE.Vector3(...(it.p || [0, 0, 0])), q, one); g.applyMatrix4(m);
    const n = g.index ? g.toNonIndexed() : g;
    pos.push(...n.attributes.position.array); nor.push(...n.attributes.normal.array);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  return out;
}

function placeHeron(i) {
  const H = life.heron, a = HERON_SPOTS[i % HERON_SPOTS.length]; H.spot = i % HERON_SPOTS.length;
  H.g.position.set(Math.cos(a) * (LAKE.rx - 1.3), -0.42, Math.sin(a) * (LAKE.rz - 1.3));
  H.g.rotation.y = Math.atan2(-Math.sin(a) * LAKE.rx, Math.cos(a) * LAKE.rz) + rand(-0.4, 0.4); H.base = H.g.position.clone();
}
function updateLife(dt) {
  life.duckT += dt * 0.045;
  life.ducks.forEach((d, i) => { const t = life.duckT - i * 0.07, x = -8 + 11 * Math.cos(t), z = 4 + 6 * Math.sin(t);
    d.position.set(x, waveH(x, z, T) + 0.03, z); d.rotation.y = Math.atan2(-11 * Math.sin(t), 6 * Math.cos(t)); d.rotation.z = Math.sin(T * 2 + i) * 0.06; });
  life.rippleT -= dt; if (life.rippleT <= 0 && life.ducks[0]) { life.rippleT = 1.6; const p = life.ducks[0].position; ripple(p.x, 0, p.z, 0.35); }
  const H = life.heron;
  if (H) {
    H.t += dt;
    if (!H.act && H.t > H.next) {
      H.t = 0; H.next = rand(10, 24); H.at = 0; const r = Math.random(); H.act = r < 0.45 ? 'strike' : r < 0.85 ? 'step' : 'turn';
      if (H.act === 'step') { H.from = H.g.position.clone(); const yaw = H.g.rotation.y, d = rand(-0.8, 0.8); H.to = H.base.clone().add(new THREE.Vector3(Math.sin(yaw) * d, 0, Math.cos(yaw) * d)); }
      if (H.act === 'turn') { H.yaw0 = H.g.rotation.y; H.yaw1 = H.yaw0 + rand(-0.8, 0.8); }
    }
    if (H.act) {
      H.at += dt;
      if (H.act === 'strike') {
        const k = H.at < 0.35 ? H.at / 0.35 : H.at < 0.7 ? 1 : Math.max(0, 1 - (H.at - 0.7) / 0.6); H.neck.rotation.x = 1.25 * k;
        if (H.at > 0.33 && !H.splashed) { H.splashed = true; const p = H.g.position; splash(p.x + Math.sin(H.g.rotation.y) * 0.7, 0, p.z + Math.cos(H.g.rotation.y) * 0.7, 6, 0.4); }
        if (H.at > 1.4) { H.act = null; H.splashed = false; H.neck.rotation.x = 0; }
      } else if (H.act === 'step') { const k = Math.min(1, H.at / 2); H.g.position.lerpVectors(H.from, H.to, smooth(k)); if (k >= 1) H.act = null; }
      else { const k = Math.min(1, H.at / 1.2); H.g.rotation.y = lerp(H.yaw0, H.yaw1, smooth(k)); if (k >= 1) H.act = null; }
    }
    H.head.rotation.y = Math.sin(T * 0.4) * 0.5;
    H.move += dt; // 가끔 다른 얕은 곳으로 (보는 사람이 멀리 있을 때만)
    if (H.move > 90 && Math.hypot(P.pos.x - H.g.position.x, P.pos.z - H.g.position.z) > 22) { H.move = 0; placeHeron(H.spot + 1 + Math.floor(Math.random() * 3)); }
  }
  if (life.boat) { const b = life.boat; b.position.y = waveH(b.position.x, b.position.z, T) - 0.02; b.rotation.z = Math.sin(T * 0.9) * 0.04; b.rotation.x = Math.sin(T * 0.7) * 0.02; }
}

];
const FORCE_HOUR = params.has('t') ? parseFloat(params.get('t')) : null;
const kstNow = () => { const d = new Date(); return (d.getUTCHours() + 9) % 24 + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600; };
const hourOffset = FORCE_HOUR == null ? 0 : FORCE_HOUR - kstNow();
const curHour = () => ((kstNow() + hourOffset) % 24 + 24) % 24;
const isRush = h => (h >= 5 && h < 5.5) || (h >= 18 && h < 18.5);
const periodName = h => h < 4 ? '밤' : h < 6.5 ? '새벽' : h < 9 ? '아침' : h < 17 ? '낮' : h < 19.5 ? '해 질 녘' : '밤';
const env = { hour: 12, night: 0, rush: false, sunDir: new THREE.Vector3(0, 1, 0) };
const _c = [new THREE.Color(), new THREE.Color(), new THREE.Color(), new THREE.Color(), new THREE.Color()];
const COLD = new THREE.Color('#dce6f0');
function applyTime() {
  const h = curHour(); env.hour = h; env.rush = isRush(h);
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1].h <= h) i++;
  const A = KEYS[i], B = KEYS[i + 1], t = smooth(clamp((h - A.h) / (B.h - A.h), 0, 1));
  const top = _c[0].set(A.top).lerp(_c[4].set(B.top), t).clone(), bot = _c[1].set(A.bot).lerp(_c[4].set(B.bot), t).clone();
  const sunC = _c[2].set(A.sun).lerp(_c[4].set(B.sun), t).clone(), water = _c[3].set(A.water).lerp(_c[4].set(B.water), t).clone();
  const night = lerp(A.night, B.night, t), mist = lerp(A.mist, B.mist, t);
  if (PL.ice) { const k = 0.35 * (1 - night * 0.8); top.lerp(COLD, k * 0.6); bot.lerp(COLD, k); }
  env.night = night;
  skyMat.uniforms.uTop.value.copy(top); skyMat.uniforms.uBot.value.copy(bot);
  scene.fog.color.copy(bot).lerp(top, 0.15);
  // 해·달 위치 (북쪽 하늘을 가로지르도록 배치: 저수지 쪽을 보면 보이게)
  const isSun = h >= 5.4 && h <= 19.4; const tt = isSun ? (h - 5.4) / 14 : (((h < 5.4 ? h + 24 : h) - 19.4) / 10);
  const phi = Math.PI * tt; env.sunDir.set(Math.cos(phi), Math.sin(phi) * 0.85 + 0.02, -0.55).normalize();
  skyMat.uniforms.uSunDir.value.copy(env.sunDir); skyMat.uniforms.uSunCol.value.copy(sunC).multiplyScalar(isSun ? 1 : 0.7);
  skyMat.uniforms.uGlow.value = isSun ? 1 : 0.25; skyMat.uniforms.uDisc.value = isSun ? 1 : 0.6;
  sun.color.copy(sunC); sun.intensity = lerp(A.sunI, B.sunI, t) * (PL.ice ? 0.85 : 1);
  hemi.color.copy(top).lerp(new THREE.Color(0xffffff), 0.5); hemi.groundColor.set(PL.ice ? 0x8a96a8 : 0x4a5a3a).multiplyScalar(1 - night * 0.6);
  hemi.intensity = lerp(A.hemi, B.hemi, t) * (PL.ice ? 1.1 : 1);
  if (waterMat) waterMat.color.copy(water);
  starMat.opacity = clamp(night * 1.1 - 0.1, 0, 1) * (PL.ice ? 0.6 : 1);
  cloudMat.color.copy(bot).lerp(new THREE.Color(0xffffff), 0.55 - night * 0.4); cloudMat.opacity = PL.ice ? 0.95 : 0.85 - night * 0.5;
  for (const g of nightGlows) g.material.opacity = clamp(night * 1.2, 0, 1) * 0.85;
  for (const m of nightMats) { m.emissiveIntensity = Math.max(m.userData.base ?? 0, night * 1.1); if (m.userData.tent) m.opacity = night * 0.3; }
  for (const s of mists) s.material.opacity = mist * 0.3;
  updateClock();
}

/* 복사 · 저장 · 공유 */
function copyText(t) {
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove(); };
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(fallback); else fallback(); } catch (e) { fallback(); }
}
function download(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); }
function canvasFile(cv, name, q = 0.9) { // 동기 변환 (공유는 터치 직후에 불러야 해서)
  const url = cv.toDataURL('image/jpeg', q), bin = atob(url.split(',')[1]), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return { url, file: new File([u8], name, { type: 'image/jpeg' }) };
}
const canShareFile = f => !IN_APP && !!navigator.canShare && (() => { try { return navigator.canShare({ files: [f] }); } catch (e) { return false; } })();
async function saveImage(cv, name) {
  if (!cv) return; const { url, file } = canvasFile(cv, name);
  if (IS_TOUCH && canShareFile(file)) { try { await navigator.share({ files: [file], title: '찌멍' }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  if (IS_TOUCH && (IS_IOS || IN_APP)) { $('cardNote').innerHTML = '<b>카드를 길게 눌러</b> 사진에 저장하세요'; return; }
  download(url, name); $('cardNote').textContent = '기록 카드를 저장했어요';
}
async function shareStory(cv) {
  if (!cv) return;
  copyText(SITE_URL);
  const { url, file } = canvasFile(cv, 'jjimeong-story.jpg', 0.92);
  if (canShareFile(file)) {
    toast('링크가 복사됐어요<small>스토리에서 \'링크\' 스티커에 붙여 넣으세요</small>', 4);
    try { await navigator.share({ files: [file], title: '찌멍', text: `찌 보며 멍때리기 🎣 ${SITE_URL}` }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  // 파일 공유가 안 되는 곳(인스타·카톡 안, 데스크톱): 이미지를 크게 보여 주고 저장 방법 안내
  $('storyImg').src = url; storyView.dataset.url = url;
  $('storyHelp').innerHTML = (IS_IOS ? '<b>이미지를 길게 눌러 \'사진에 저장\'</b> → 인스타그램 앱 → 스토리 → 사진 선택' : IN_APP ? '<b>이미지를 길게 눌러 저장</b>하거나 아래 버튼을 누르세요 → 인스타그램 스토리에서 사진 선택' : '이미지를 저장한 뒤 인스타그램 스토리에서 사진을 고르세요')
    + '<br>링크도 복사해 뒀어요 · 스토리 \'링크\' 스티커에 붙여 넣기';

/* 물고기 그림 (도감 · 계측자) */
const hex = c => '#' + new THREE.Color(c).getHexString();
function drawFishShape(c, sp, x0, cy, len, hMax, col, detail, flip) {
  // x0 = 입(flip=true 면 왼쪽이 입), len = 몸 길이(px)
  c.save(); if (flip) { c.translate(x0, 0); c.scale(-1, 1); c.translate(-x0, 0); }
  // 오른쪽을 향하게 그린 뒤 필요하면 뒤집어요: 입 = x0, 꼬리 = x0 - len
  const tailX = x0 - len;
  c.fillStyle = col;
  if (sp.shape === 'boot') {
    const h = Math.min(hMax, len * 0.9); c.fillRect(tailX, cy - h / 2, len * 0.45, h); c.fillRect(tailX, cy + h / 2 - h * 0.32, len, h * 0.32);
    c.restore(); return;
  }
  if (sp.shape === 'glove') {
    const h = Math.min(hMax, len * 0.8); c.fillRect(tailX + len * 0.3, cy - h * 0.35, len * 0.7, h * 0.7);
    for (let k = 0; k < 4; k++) c.fillRect(tailX, cy - h * 0.35 + k * h * 0.19, len * 0.34, h * 0.13);
    c.fillRect(tailX + len * 0.55, cy - h / 2, len * 0.15, h * 0.2); c.restore(); return;
  }
  const deepK = { crucian: 0.4, carp: 0.3, catfish: 0.22, slim: 0.17, trout: 0.26 }[sp.shape] || 0.28;
  const h = Math.min(hMax, len * deepK), bodyL = len * 0.8, tailL = len * 0.2, bx = tailX + tailL + bodyL / 2;
  c.beginPath(); c.ellipse(bx, cy, bodyL / 2, h / 2, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(tailX + tailL + bodyL * 0.08, cy); c.lineTo(tailX, cy - h * 0.48); c.lineTo(tailX + tailL * 0.3, cy); c.lineTo(tailX, cy + h * 0.48); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(bx - bodyL * 0.18, cy - h * 0.44); c.lineTo(bx + bodyL * 0.02, cy - h * 0.7); c.lineTo(bx + bodyL * 0.16, cy - h * 0.4); c.fill();
  if (detail) {
    if (sp.belly) { c.fillStyle = hex(sp.belly); c.beginPath(); c.ellipse(bx + bodyL * 0.04, cy + h * 0.2, bodyL * 0.36, h * 0.2, 0, 0, Math.PI * 2); c.fill(); }
    if (sp.stripe) { c.fillStyle = hex(sp.stripe); c.fillRect(bx - bodyL * 0.38, cy - h * 0.04, bodyL * 0.76, Math.max(2, h * 0.08)); }
    c.fillStyle = '#0b0c0e'; c.beginPath(); c.arc(x0 - bodyL * 0.14, cy - h * 0.1, Math.max(2, h * 0.07), 0, Math.PI * 2); c.fill();
    if (sp.shape === 'catfish') { c.strokeStyle = '#0b0c0e'; c.lineWidth = Math.max(1, h * 0.03); c.beginPath(); c.moveTo(x0 - 2, cy + h * 0.05); c.lineTo(x0 + len * 0.1, cy + h * 0.35); c.stroke(); }
  }
  c.restore();
}
function drawFish2D(c, sp, w, h, dark) {
  c.clearRect(0, 0, w, h);
  drawFishShape(c, sp, w * 0.92, h / 2, w * 0.84, h * 0.8, dark ? '#3a4048' : hex(sp.color), !dark, false);
}
// 계측자: 1cm 눈금, 5·10cm 강조. 입을 0에 대고 실제 비율로 물고기를 그려요
function drawRuler(c, x, y, w, h, sp, cm) {
  const range = Math.max(10, Math.ceil(cm * 1.15 / 10) * 10), pad = 18, x0 = x + pad + 10, px = (w - pad * 2 - 10) / range;
  c.fillStyle = '#1b1f24'; c.fillRect(x, y, w, h);
  c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 2; c.strokeRect(x + 1, y + 1, w - 2, h - 2);
  c.fillStyle = '#ffffff'; c.fillRect(x0 - 10, y + 8, 10, h - 16); // 0 받침
  const tickBase = y + h - 8;
  c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.font = `600 ${Math.round(h * 0.13)}px ${FONT}`;
  for (let i = 0; i <= range; i++) {
    const tx = x0 + i * px, big = i % 10 === 0, mid = i % 5 === 0;
    if (!mid && px < 2.5) continue;
    const L = big ? h * 0.28 : mid ? h * 0.18 : h * 0.1;
    c.fillStyle = big ? '#ffffff' : 'rgba(255,255,255,.55)'; c.fillRect(Math.round(tx) - 1, tickBase - L, 2, L);
    if (big && i > 0) { c.fillStyle = 'rgba(255,255,255,.75)'; c.fillText(String(i), tx, tickBase - L - 6); }
  }
  const fishLen = cm * px, cy = y + h * 0.36;
  drawFishShape(c, sp, x0, cy, fishLen, h * 0.42, hex(sp.color), true, true);
  const mx = x0 + fishLen;
  c.fillStyle = '#FF4A1C'; c.fillRect(Math.round(mx) - 2, y + 6, 4, h - 12);
  c.font = `800 ${Math.round(h * 0.19)}px ${FONT}`; c.textBaseline = 'top';
