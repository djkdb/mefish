function rnd(a, b) { return a + Math.random() * (b - a); }
function speckle(g, w, h, n, colors, rmin, rmax, amin = 0.08, amax = 0.3) {
  for (let i = 0; i < n; i++) {

    g.globalAlpha = rnd(amin, amax);

  }

}
function textPlane(w, h, pw, ph, draw, opts = {}) {
  const tex = canvasTex(pw, ph, draw, null, true);

}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

const T1 = [1, 1];
function planks(g, w, h, cols, vertical, gap) {
  const n = cols.length, sz = (vertical ? w : h) / 8;

    g.fillStyle = cols[i % n];
    if (vertical) g.fillRect(i * sz, 0, sz, h); else g.fillRect(0, i * sz, w, sz);
    g.strokeStyle = 'rgba(60,35,15,0.22)'; g.lineWidth = 1;
    for (let k = 0; k < 4; k++) {
      const o = i * sz + rnd(3, sz - 3); g.beginPath();
      if (vertical) { g.moveTo(o, 0); g.bezierCurveTo(o + rnd(-4, 4), h * 0.3, o + rnd(-4, 4), h * 0.7, o + rnd(-3, 3), h); }
      else { g.moveTo(0, o); g.bezierCurveTo(w * 0.3, o + rnd(-4, 4), w * 0.7, o + rnd(-4, 4), w, o + rnd(-3, 3)); }
      g.stroke();
    }
    g.fillStyle = `rgba(30,15,5,${gap})`;

function tiles(g, w, h, n, colA, colB, grout) {

}

function makeCharacter(o) {
  const skinMat = o.ownSkin ? new THREE.MeshLambertMaterial({ color: 0xf3cfa9 }) : lam(0xf3cfa9);

      const len = Math.hypot(x2 - x1, y2 - y1), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const rr = 0.25 + (0.21 - 0.25) * ((my - 0.59) / 0.58);
      const m = add(collarGeo, tm, mx, my, Math.sqrt(Math.max(0, rr * rr - mx * mx)) + 0.006);
      m.scale.x = len; m.rotation.z = Math.atan2(y2 - y1, x2 - x1); m.rotation.y = -Math.asin(Math.max(-0.9, Math.min(0.9, mx / rr))) * 0.8;
    };

    band(0.115, 1.155, 0.015, 0.975); // 반대쪽 깃 — 아래에서 만나 V자
    const n = add(neckGeo, tm, 0, 1.165, -0.01); n.rotation.x = -Math.PI / 2; n.scale.set(0.8, 0.95, 1);

  for (const s of [1, -1]) {
    const p = new THREE.Group(); p.position.set(0.12 * s, 0.62, 0); body.add(p);
    add(GEO.shorts, shortsMat, 0, -0.15, 0, p);
    add(GEO.leg, skinMat, 0, -0.46, 0, p);
    add(GEO.foot, skinMat, 0, -0.585, 0.04, p);

    const p = new THREE.Group(); p.position.set(0.29 * s, 1.12, 0); body.add(p);
    add(GEO.sleeve, shirtMat, 0, -0.09, 0, p);
    add(GEO.arm, skinMat, 0, -0.33, 0, p);

  add(GEO.head, skinMat, 0, 0.25, 0, headG);
  for (const s of [1, -1]) {
    add(GEO.eye, BLACK, 0.1 * s, 0.27, 0.255, headG);
    const c = add(GEO.cheek, CHEEK, 0.165 * s, 0.17, 0.21, headG); c.scale.set(1, 0.6, 0.4);
  }
  const mouth = add(GEO.mouth, BLACK, 0, 0.15, 0.265, headG); mouth.rotation.z = Math.PI;

    const tm = lam(o.towel), ts = lam(o.towelLine || 0xe0d2bf);

  };
  return ch;
}

  const strs = ['찜멍', '오늘의 찜질 기록', SITE_HOST, dateStr, zoneLabel(z), me.name, ...rows.flat()].join('');
  try { await Promise.all([font(80, 800), font(40, 700), font(30, 600)].map(f => document.fonts.load(f, strs))); } catch (e) {}
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#0e0b09'; g.fillRect(0, 0, W, H);
  g.drawImage(shot, 0, 0);
  const fade = g.createLinearGradient(0, 1000, 0, 1240); fade.addColorStop(0, 'rgba(14,11,9,0)'); fade.addColorStop(1, 'rgba(14,11,9,1)'); g.fillStyle = fade; g.fillRect(0, 1000, W, 240);
  // 구역 전광판 (사진 위, 윗부분 250px 아래)
  g.font = font(46, 800); const zt = zoneLabel(z), zw = g.measureText(zt).width + 56;
  g.fillStyle = '#050403'; g.fillRect(60, 300, zw, 84); g.strokeStyle = '#3b2a1b'; g.lineWidth = 2; g.strokeRect(60, 300, zw, 84);
  g.fillStyle = '#ffb23e'; g.shadowColor = 'rgba(255,150,40,0.8)'; g.shadowBlur = 14; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillText(zt, 88, 344); g.shadowBlur = 0;
  // 기록 영수증 (1180~1600)
  const X0 = 60, X1 = W - 60, Y0 = 1180, Y1 = 1600;
  g.fillStyle = '#16120f'; g.fillRect(X0, Y0, X1 - X0, Y1 - Y0); g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 2; g.strokeRect(X0, Y0, X1 - X0, Y1 - Y0);
  g.fillStyle = '#d9481f'; g.fillRect(X0, Y0, X1 - X0, 8);
  g.fillStyle = '#ffffff'; g.font = font(80, 800); g.textAlign = 'left'; g.fillText('찜멍', X0 + 36, Y0 + 78);
  g.font = font(30, 600); g.fillStyle = '#a8a29e'; g.fillText('오늘의 찜질 기록', X0 + 36 + g.measureText('찜멍').width * 2.7 + 24, Y0 + 82);
  g.textAlign = 'right'; g.fillText(dateStr, X1 - 36, Y0 + 82);
  g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(X0 + 36, Y0 + 132, X1 - X0 - 72, 2);
  rows.forEach(([a, b], i) => {
    const col = i % 2, row = (i / 2) | 0, x = X0 + 36 + col * ((X1 - X0 - 72) / 2 + 18), y = Y0 + 182 + row * 70, cw = (X1 - X0 - 72) / 2 - 18;
    g.textAlign = 'left'; g.fillStyle = '#a8a29e'; g.font = font(30, 600); g.fillText(a, x, y);
    g.textAlign = 'right'; g.fillStyle = '#ffffff'; g.font = font(40, 800);
    let fs = 40; while (g.measureText(b).width > cw - 140 && fs > 24) { fs -= 2; g.font = font(fs, 800); }
    g.fillText(b, x + cw, y);
  });
  g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(X0 + 36, Y1 - 58, X1 - X0 - 72, 2);
  g.textAlign = 'left'; g.font = font(28, 600); g.fillStyle = '#a8a29e'; g.fillText(me.name, X0 + 36, Y1 - 28);
  g.textAlign = 'right'; g.fillStyle = '#ffffff'; g.fillText(SITE_HOST, X1 - 36, Y1 - 28);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', 0.9));
}
async function shareStory() {
  haptic(15); helpEl.hidden = true; panelEl.hidden = true; offerEl.hidden = true;
  let blob = storyCache && Date.now() - storyCache.at < 20000 ? storyCache.b : null;
  if (!blob) { toast('스토리 이미지 만드는 중…', 1.5); try { blob = await prepareStory(); } catch (e) { toast('이미지를 만들지 못했어요', 2); return; } }
  storyCache = null;
  const file = new File([blob], `jjimmung-${todayKey()}.jpg`, { type: 'image/jpeg' });
  copyLink(true).then(ok => toast(ok ? "링크가 복사됐어요 · 스토리에서 '링크' 스티커에 붙여 넣으세요" : '스토리에 사진을 올리고 링크 스티커를 붙여 보세요', 4));
  if (!IN_APP && navigator.canShare && navigator.share) {
    let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) {}
    if (can) {
      try { await navigator.share({ files: [file], title: '찜멍', text: SITE_URL }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  showStoryFallback(blob, file.name);
}
let storyURL = null;
function showStoryFallback(blob, name) {
  if (storyURL) URL.revokeObjectURL(storyURL);
  storyURL = URL.createObjectURL(blob);
  const howIOS = '이미지를 <b>길게 눌러 저장</b> → 인스타 앱 → <b>스토리</b> → 사진 선택';
  const howElse = '<b>이미지 저장</b> → 인스타 앱 → <b>스토리</b> → 사진 선택';
  storyEl.innerHTML = `<div class="card pnl" role="dialog" aria-label="스토리 공유">
    <img src="${storyURL}" alt="오늘의 찜질 기록 이미지">
    <p>${IS_IOS ? howIOS : howElse}</p><p class="note">스토리에서 <b>링크</b> 스티커를 누르고 복사한 주소를 붙여 넣으세요.</p>
    <div class="row">${IS_IOS ? '' : `<a class="btn acc" href="${storyURL}" download="${name}" data-dl>이미지 저장</a>`}<button class="btn" data-copy>링크 복사</button><button class="btn ghost" data-close>닫기</button></div></div>`;
  storyEl.hidden = false;
}
storyEl.addEventListener('click', e => {
  const b = e.target.closest('button,a'); if (!b) { if (e.target === storyEl) storyEl.hidden = true; return; } haptic(8);
  if (b.dataset.close !== undefined) storyEl.hidden = true; else if (b.dataset.copy !== undefined) copyLink();
});

// ───────────────────────── 디버그 화면 (?debug) ─────────────────────────
const dbgEl = document.getElementById('dbg');
if (DEBUG) { dbgEl.hidden = false; setInterval(() => {
  const i = renderer.info, p = player.root.position;
  dbgEl.textContent = `fps ${fps.toFixed(0)} · render ${lastRenderMs.toFixed(1)}ms\ncalls ${i.render.calls} · tris ${(i.render.triangles / 1000).toFixed(0)}k · geo ${i.memory.geometries} · tex ${i.memory.textures}\npr ${renderer.getPixelRatio().toFixed(2)} · tier ${Q.tier} · ${viewSize().w}×${viewSize().h}\nzone ${curZone.id} · ${p.x.toFixed(1)},${p.z.toFixed(1)} · mode ${state.mode}\nnet ${net ? (net.connected ? 'on' : 'off') : 'file'} · remotes ${remotes.size}\n${IN_APP ? 'in-app ' + IN_APP_NAME + ' · ' : ''}${STANDALONE ? 'standalone · ' : ''}${UA.slice(0, 60)}\n` + (window.__errs.slice(-4).join('\n') || 'no errors');
}, 500); }

// ───────────────────────── 화질 자동 조절 · 숨김 시 멈춤 ─────────────────────────
const fpsHist = []; let tierChangedAt = 0, bootAt = performance.now();
const fixedTier = QS.has('q') ? THREE.MathUtils.clamp(parseInt(QS.get('q'), 10) || 0, 0, 3) : null;
if (fixedTier !== null) setTier(fixedTier);
function onFps(f) {
  if (fixedTier !== null || document.hidden) return;
  const now = performance.now(); if (now - bootAt < 1500) return;
  fpsHist.push(f); if (fpsHist.length > 4) fpsHist.shift();
  const avg = fpsHist.reduce((a, b) => a + b, 0) / fpsHist.length;
  const early = now - bootAt < 25000;
  if (fpsHist.length >= 4 && Q.tier < 3 && now - tierChangedAt > 2500 && (avg < (early ? 40 : 26))) { setTier(Q.tier + 1); tierChangedAt = now; fpsHist.length = 0; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (A.ctx && A.ctx.state === 'running') A.ctx.suspend(); saveStats(); }
  else if (!running) { running = true; clock.getDelta(); fpsHist.length = 0; requestAnimationFrame(frame); if (A.ctx && !A.muted) A.ctx.resume(); }
});
addEventListener('pagehide', saveStats);

// ───────────────────────── 서비스 워커 (홈 화면 앱 · 오프라인 혼자 모드) ─────────────────────────
if ((location.protocol === 'https:' || location.hostname === 'localhost') && 'serviceWorker' in navigator && !QS.has('nosw')) {
  const reg = () => navigator.serviceWorker.register('sw.js').catch(() => {});
  if (document.readyState === 'complete') setTimeout(reg, 1500); else addEventListener('load', () => setTimeout(reg, 1500));
}

// ───────────────────────── 글꼴이 오면 표지판 다시 그리기 ─────────────────────────
async function loadSignFonts(tries = 0) {
  if (!document.fonts || !document.fonts.load) return;
  const txt = [...SIGN_TEXT].join('') + '0123456789:·';
  try {
    const r = await Promise.all([800, 700, 600].map(w => document.fonts.load(font(40, w), txt)));
    if (!r.some(a => a.length) && tries < 6) { setTimeout(() => loadSignFonts(tries + 1), 800); return; }
    fontsReady = true; for (const f of fontRedraws) f(); fontRedraws.length = 0; renderStats(true);
  } catch (e) { if (tries < 6) setTimeout(() => loadSignFonts(tries + 1), 800); }
}

// ───────────────────────── 시작 ─────────────────────────
setZoneHUD(curZone); visitZone(curZone); drawTV(); cull();
renderer.compile(scene, camera);
requestAnimationFrame(() => {
  frame();
  window.__booted = true; clearTimeout(window.__bootT);
  const L = document.getElementById('loader'); L.style.transition = 'opacity .35s'; L.style.opacity = 0; setTimeout(() => L.remove(), 400);
  const T = LS.get('jjimmung-tut', { n: 0, off: false });
  if (!T.off && T.n < 2 && !QS.has('notut')) openTut(); else setTimeout(() => showLED(zoneLabel(curZone)), 300);
});
loadSignFonts();

// 테스트·디버그용
window.__jjim = {
  player, state, stats, get today() { return today; }, me, remotes, net, SEATS, ZONES, Q, renderer, scene, setTier, setMode, standUp,
  get zone() { return curZone.id; }, get acts() { return curActs.map(a => a.id + (a.disabled ? '(off)' : '')); },
  act(id) { const a = curActs.find(x => x.id === id && !x.disabled); if (a) { a.fn(); return true; } return false; },
  teleport(x, z, h) { if (TOGGLE[state.mode]) standUp(); else if (state.mode !== 'free') setMode('free'); player.root.position.set(x, 0, z); if (h !== undefined) { state.heading = h; camYaw = h + Math.PI; } camPos.set(x + Math.sin(camYaw) * 4, 3, z + Math.cos(camYaw) * 4); },
  makeStory, shareStory, prepareStory, openHelp, openTut, collide, WORLD,
  // 홍보 이미지용: 지정한 시점에서 한 장 렌더링해 dataURL 로
  renderView(pos, look, W, H, fov = 50) {
    const cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 80); cam.position.set(...pos); cam.lookAt(...look);
    for (const z of ZONES) ZG[z.id].visible = rectDist(pos[0], pos[2], z) < 22;
    for (const n of npcs) { n.ch.root.visible = true; setLod(n.ch, true); }
    for (const h of HANGS) h.visible = false;
    const pr = renderer.getPixelRatio(); renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.render(scene, cam);
    const url = renderer.domElement.toDataURL('image/jpeg', 0.92); renderer.setPixelRatio(pr); fitView(); cull(); return url;
  },

};
