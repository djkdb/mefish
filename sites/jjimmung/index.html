  #map { position: fixed; z-index: 5; top: calc(var(--st) + 58px); right: calc(var(--sr) + 8px); width: 150px; height: 143px; cursor: pointer; }

const SUITS = [

const vSkinGeo = (() => {
  const top = 1.16, tipX = 0.025, tipY = 0.965, half = 0.112, N = 8, pos = [], idx = [];
  const surf = (x, y) => { const r = 0.25 + (0.21 - 0.25) * ((y - 0.59) / 0.58); return Math.sqrt(Math.max(0, r * r - x * x)) + 0.004; };
  for (let i = 0; i <= N; i++) {               // i=0 목선, i=N 꼭짓점
    const t = i / N, y = top + (tipY - top) * t, xl = -half + (tipX + half) * t, xr = half + (tipX - half) * t;
    for (let j = 0; j <= N - i; j++) { const u = N - i === 0 ? 0 : j / (N - i), x = xl + (xr - xl) * u; pos.push(x, y, surf(x, y)); }
  }
  let a = 0;
  for (let i = 0; i < N; i++) { const n = N - i, b = a + n + 1;
    for (let j = 0; j < n; j++) { idx.push(a + j, b + j, a + j + 1); if (j < n - 1) idx.push(a + j + 1, b + j, b + j + 1); }
    a = b; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
})();

const boxes = [];      // 걷기 충돌 {x0,x1,z0,z1}

  for (const [a, b] of solid) { faces(x0, x1, 0, h, a, b, { nx: mW, px: mE, pz: 'trim', nz: 'trim', py: 'ext' }); addBox(x0, x1, a, b); camBoxes.push({ x0, x1, z0: a, z1: b, y0: -1 }); }

const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(), _sph = new THREE.Sphere();
function tapPick(cx, cy) {
  const { w, h } = viewSize(); _ndc.set(cx / w * 2 - 1, -(cy / h) * 2 + 1); _ray.setFromCamera(_ndc, camera);
  let best = null, bd = 16;
  for (const o of IX) {
    if (!o.hr || !ZG[o.zone].visible) continue;
    _sph.center.set(o.x, o.y, o.z); _sph.radius = o.hr;
    const hit = _ray.ray.intersectSphere(_sph, _v); if (!hit) continue;
    const d = hit.distanceTo(camera.position); if (d < bd) { bd = d; best = o; }
  }
  if (!best) return false;
  const p = player.root.position, dd = Math.hypot(p.x - (best.ux ?? best.x), p.z - (best.uz ?? best.z));
  if (state.mode === 'free' && best.zone === curZone.id && dd < (best.r || 1.5) * 1.5) { const a = best.acts()[0]; if (a && !a.disabled) { haptic(12); a.fn(); } }
  else toast(`${best.name} · 가까이 가면 버튼이 떠요`, 1.6);
  return true;
}

// ───────────────────────── 실시간 연결 ─────────────────────────
/* ---------------- 함께 걷기 (실시간 서버) ----------------
   서버: Cloudflare Worker /ws (Durable Object 방 하나당 최대 30명)
   - file:// 로 열면 서버 없이 혼자 걷기만 해요.
   - 움직임은 예측+보정 방식: 바뀌었을 때만 보내요(가만히 있으면 0번).
   - 연결이 끊기면 몇 초 뒤 다시 연결하고, 그동안 혼자 걷기는 그대로.
   메시지
     보냄: {t:'hello',name,look,s} · {t:'s',s} · {t:'ev',e}
     받음: {t:'welcome',id,room,peers:[{id,name,look,s}],n} · {t:'join',id,name,look,s}
           {t:'s',id,s} · {t:'leave',id} · {t:'ev',id,e} · {t:'count',n}
*/
function createNet({ site, name, look, onWelcome, onJoin, onState, onLeave, onEvent, onCount, onStatus }) {
  // 무료 한도를 아끼는 규칙
  // - 페이지를 2초 이상 보고 있거나 처음 터치/키를 누르면 그때 연결 (바로 나가는 사람은 0건)
  // - 움직임은 "예측 + 보정": 방향·속도가 바뀌거나 예측이 0.35m 이상 어긋날 때만 전송
  //   (곧게 걸으면 약 2초에 한 번, 멈춰 있으면 0번). 받는 쪽은 속도로 이어서 움직여 줘요.
  // - 탭을 3분 넘게 숨겨 두면 연결을 끊고, 다시 보면 연결
  // - 재연결은 점점 느리게(최대 60초), 숨겨진 탭에선 재연결 안 함
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return null;
  const room = new URLSearchParams(location.search).get('room') || '';
  let ws = null, retry = 0, open = false, started = false, pingT = 0, retryT = 0, hideT = 0;
  let sent = null, sentAt = 0, sentDisc = '', prev = null, vx = 0, vz = 0, lastState = null, pending = false;
  const r1 = v => Math.round(v * 10) / 10;
  const MOTION = new Set(['x', 'y', 'z', 'r', 'vx', 'vz', '_t']);
  const discOf = s => { const o = {}; for (const k in s) if (!MOTION.has(k)) o[k] = s[k]; return JSON.stringify(o); }; // 동작·자리 같은 '상태' 부분
  const url = () => `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?site=${site}${room ? `&room=${encodeURIComponent(room)}` : ''}`;
  function connect() {
    clearTimeout(retryT);
    if (document.hidden || (ws && ws.readyState <= 1)) return;
    try { ws = new WebSocket(url()); } catch (e) { return later(); }
    ws.onopen = () => {
      retry = 0; open = true; sent = null; sentDisc = '';
      ws.send(JSON.stringify({ t: 'hello', name, look, s: lastState }));
      if (lastState) { sent = lastState; sentAt = performance.now(); sentDisc = discOf(lastState); }
      clearInterval(pingT); pingT = setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 50000);
      onStatus && onStatus(true);
    };
    ws.onmessage = (e) => {

      else if (m.t === 'join') { if (m.s) m.s._t = now; onJoin && onJoin(m); }
      else if (m.t === 's') { if (m.s) m.s._t = now; onState && onState(m.id, m.s); }
      else if (m.t === 'leave') onLeave && onLeave(m.id);

    ws.onerror = () => { try { ws.close(); } catch (_) { } };
  }

    const d = Math.min(60000, 2000 * 2 ** retry++) * (0.8 + Math.random() * 0.4);
    retryT = setTimeout(connect, d);

    else { clearTimeout(hideT); if (started && !ws) { retry = 0; connect(); } }
  });
  // 페이지를 떠날 때(탭 닫기·다른 사이트로 이동·앱 종료): 서버에 인사하고 바로 연결 닫기 → 다른 사람 화면에서 즉시 퇴장
  addEventListener('pagehide', () => { if (ws && ws.readyState === 1) { try { ws.send('{"t":"bye"}'); ws.close(1000, 'bye'); } catch (_) { } } });

    sent = s; sentAt = now; sentDisc = discOf(s); pending = false;
    ws.send(JSON.stringify({ t: 's', s }));
  }
  return {
    // 매 프레임 불러도 돼요. 실제 전송은 필요할 때만.
    state(s) {
      const now = performance.now();
      if (prev) { const dt = (now - prev.t) / 1000; if (dt > 0 && dt < 0.5) { const k = Math.min(1, dt * 8); vx += ((s.x - prev.x) / dt - vx) * k; vz += ((s.z - prev.z) / dt - vz) * k; } }

      }

    },
    event(e) { if (open) ws.send(JSON.stringify({ t: 'ev', e })); },

  };
}

    <svg class="ico" viewBox="-46 -46 92 92"><path d="M-34 0h68M-26 -8l-8 8 8 8M26 -8l8 8-8 8" stroke="rgba(255,255,255,.75)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g class="hand"><circle cy="20" r="11" fill="#fff"/><rect x="-5" y="20" width="10" height="20" rx="5" fill="#fff"/></g></svg>
    <b class="tR">오른쪽 = 둘러보기</b><small class="sR">손가락을 좌우로 밀어 보세요</small>
    <span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
  </div>
  <div class="fin">좋아요! 이제 마음껏 다녀 보세요</div>
</div>
<script>
(function () {
  var KEY = 'coach-v1';
  function tutOpen() { var t = document.getElementById('tut'); if (!t || t.hidden) return false; var cs = getComputedStyle(t); return cs.display !== 'none' && cs.visibility !== 'hidden' && cs.opacity !== '0'; }
  // 튜토리얼 동안 다른 UI 숨김
  setInterval(function () { var o = tutOpen(); if (o !== document.body.classList.contains('tut-open')) document.body.classList.toggle('tut-open', o); }, 200);

  var done = false; try { done = localStorage.getItem(KEY) === '1'; } catch (e) {}
  var el = document.getElementById('coach');
  if (done || /[?&](nocoach|notut)\b/.test(location.search)) { el.remove(); return; }
  var coarse = matchMedia('(pointer: coarse)').matches;
  if (!coarse) { // 컴퓨터: 키보드 + 마우스
    el.querySelector('.tL').textContent = 'WASD · 방향키 = 걷기'; el.querySelector('.sL').textContent = 'Shift를 누르면 달려요';
    el.querySelector('.tR').textContent = '마우스 끌기 = 둘러보기'; el.querySelector('.sR').textContent = '화면을 누른 채 좌우로 끌어 보세요';
  }
  var L = el.querySelector('.L'), R = el.querySelector('.R'), moved = false, looked = false, finished = false, ptr = {};
  function shown(e) { if (!e || e.hidden) return false; var cs = getComputedStyle(e); return cs.display !== 'none' && cs.visibility !== 'hidden' && cs.opacity !== '0'; }
  function blocked() { // 다른 창(모달·시트·미니게임)이 실제로 보이면 잠시 숨김
    var c = document.querySelectorAll('.modal, #sheet, #catchModal, #mg, #storyView');
    for (var i = 0; i < c.length; i++) if (shown(c[i])) return true;
    return false;
  }
  function ready() { return !!window.__booted && !document.getElementById('loader') && !(document.getElementById('loading') && getComputedStyle(document.getElementById('loading')).display !== 'none' && getComputedStyle(document.getElementById('loading')).opacity !== '0') && !tutOpen() && !blocked(); }
  function haptic(ms) { try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} }
  function mark(side) {
    if (side === 'L' && !moved) { moved = true; L.classList.add('done'); haptic(15); }
    if (side === 'R' && !looked) { looked = true; R.classList.add('done'); haptic(15); }
    if (moved && looked && !finished) {
      finished = true; try { localStorage.setItem(KEY, '1'); } catch (e) {}
      var f = el.querySelector('.fin'); f.style.display = 'block';
      setTimeout(function () { el.classList.remove('on'); setTimeout(function () { el.remove(); }, 400); }, 1400);
    }
  }
  var iv = setInterval(function () { if (finished) { clearInterval(iv); return; } el.classList.toggle('on', ready()); }, 250);
  // 실제 조작을 감지 (게임 조작은 막지 않음)
  addEventListener('pointerdown', function (e) {
    if (!el.classList.contains('on') || (e.target.closest && e.target.closest('button, a, input, .pnl, #map'))) return;
    var side = coarse ? (e.clientX < innerWidth / 2 ? 'L' : 'R') : 'R';
    ptr[e.pointerId] = { x: e.clientX, y: e.clientY, side: side };
  }, { capture: true, passive: true });
  addEventListener('pointermove', function (e) {
    var p = ptr[e.pointerId]; if (!p) return;
    var d = Math.hypot(e.clientX - p.x, e.clientY - p.y);
    if (d > (p.side === 'L' ? 30 : 45)) { mark(p.side); delete ptr[e.pointerId]; }
  }, { capture: true, passive: true });
  function up(e) { delete ptr[e.pointerId]; }
  addEventListener('pointerup', up, { capture: true, passive: true });
  addEventListener('pointercancel', up, { capture: true, passive: true });
  addEventListener('keydown', function (e) { if (/^(Key[WASD]|Arrow(Up|Down|Left|Right))$/.test(e.code) && el.classList.contains('on')) mark('L'); }, true);
  window.__coach = { get moved() { return moved; }, get looked() { return looked; }, get on() { return el.classList.contains('on'); } };
})();
</script>
