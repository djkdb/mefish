  #map { position: fixed; z-index: 5; top: calc(var(--st) + 58px); right: calc(var(--sr) + 8px); width: 150px; height: 143px; cursor: pointer; }

const NAV = { S: 0.5, nx: 0, nz: 0, free: null, dest: null, path: null, auto: false, lastPlan: 0 };
function navBuild() {
  if (NAV.free) return;
  const S = NAV.S; NAV.nx = Math.round((WORLD.x1 - WORLD.x0) / S); NAV.nz = Math.round((WORLD.z1 - WORLD.z0) / S);
  NAV.free = new Uint8Array(NAV.nx * NAV.nz); const p = { x: 0, z: 0 };
  for (let j = 0; j < NAV.nz; j++) for (let i = 0; i < NAV.nx; i++) {
    const x = WORLD.x0 + (i + 0.5) * S, z = WORLD.z0 + (j + 0.5) * S; p.x = x; p.z = z; collide(p, true);
    NAV.free[j * NAV.nx + i] = Math.hypot(p.x - x, p.z - z) < 0.02 ? 1 : 0;
